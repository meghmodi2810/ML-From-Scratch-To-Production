name: Continuous Deployment (CD - Build & Push)

on:
  workflow_run:
    workflows: ["Continuous Testing (CI)"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_SERVE_REPO: nyc-taxi-mlops-nyc-taxi-serve-dev
  ECR_LAMBDA_REPO: nyc-taxi-mlops-nyc-taxi-lambda-dev

jobs:
  # ===================================================================
  # JOB: BUILD & PUSH BOTH EC2 AND LAMBDA DOCKER CONTAINERS TO ECR
  # ===================================================================
  build-and-push:
    name: Build & Push EC2 and Serverless Containers to ECR
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Extract Short Git SHA for Immutable Tagging
      - name: Set Short Git SHA
        id: vars
        run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # Step 3: Authenticate with AWS via OpenID Connect (OIDC)
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: GitHubActions-Build-${{ github.run_id }}

      # Step 4: Log in to Amazon ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 5: Set up Docker Buildx (Layer Caching & Multi-stage)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 6: Build & Push EC2 Serving Container (Dockerfile.serve)
      - name: Build & Push EC2 Serving Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.serve
          push: true
          provenance: false # AWS Lambda & EC2 compatible manifest format
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_SERVE_REPO }}:${{ steps.vars.outputs.sha_short }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_SERVE_REPO }}:latest
          cache-from: type=gha,scope=serve
          cache-to: type=gha,mode=max,scope=serve

      # Step 7: Build & Push Serverless Lambda Container (Dockerfile.lambda)
      - name: Build & Push Serverless Lambda Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.lambda
          push: true
          provenance: false # CRITICAL: Disables OCI provenance attestations required by AWS Lambda
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_LAMBDA_REPO }}:${{ steps.vars.outputs.sha_short }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_LAMBDA_REPO }}:latest
          cache-from: type=gha,scope=lambda
          cache-to: type=gha,mode=max,scope=lambda
