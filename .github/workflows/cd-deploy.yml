name: Continuous Deployment (CD - Deploy to EC2)

on:
  workflow_run:
    workflows: ["Continuous Deployment (CD - Build & Push)"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: nyc-taxi-mlops-nyc-taxi-serve-dev

jobs:
  # ===================================================================
  # JOB: ZERO-TOUCH DEPLOYMENT TO EC2 VIA AWS SYSTEMS MANAGER (SSM)
  # Automatically triggers ONLY AFTER CD Build & Push completes successfully!
  # ===================================================================
  deploy-to-ec2:
    name: Ship Container to Live EC2 Server
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      # Step 1: Authenticate with AWS via OpenID Connect (OIDC)
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: GitHubActions-Deploy-${{ github.run_id }}

      # Step 2: Trigger Automated Remote Deployment via AWS SSM
      - name: Execute Remote Deployment on EC2
        run: |
          echo "🚀 Initiating zero-touch deployment on EC2 Instance: ${{ secrets.EC2_INSTANCE_ID }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Automated deployment of NYC Taxi FastAPI container via GitHub Actions" \
            --parameters 'commands=[
              "set -e",
              "echo \"[1/5] Logging into Amazon ECR...\"",
              "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com",
              "echo \"[2/5] Pulling latest production container image...\"",
              "docker pull $(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest",
              "echo \"[3/5] Performing safe container restart...\"",
              "docker stop nyc-taxi-serve || true",
              "docker rm nyc-taxi-serve || true",
              "docker run -d --name nyc-taxi-serve --restart always -p 8000:8000 $(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest",
              "echo \"[4/5] Verifying endpoint health with polling...\"",
              "HEALTH_OK=0",
              "for i in $(seq 1 12); do if curl -s -f http://localhost:8000/health > /dev/null; then echo \"[Health Check] Passed on attempt $i!\"; HEALTH_OK=1; break; fi; echo \"[Health Check] Waiting for server (attempt $i/12)...\"; sleep 3; done",
              "if [ $HEALTH_OK -eq 0 ]; then echo \"❌ Health check failed after 12 attempts! Dumping container logs:\"; docker logs --tail 50 nyc-taxi-serve; exit 1; fi",
              "echo \"[5/5] Cleaning dangling Docker image layers...\"",
              "docker image prune -f",
              "echo \"✅ FastAPI Model Serving Container successfully deployed and healthy!\""
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command Dispatched successfully! Command ID: $COMMAND_ID"
          echo "Waiting for EC2 execution to complete..."

          # Poll SSM Command Status until completion
          STATUS="InProgress"
          while [ "$STATUS" = "InProgress" ] || [ "$STATUS" = "Pending" ] || [ "$STATUS" = "Delayed" ]; do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "InProgress")
            echo "Current deployment status: $STATUS"
          done

          # Fetch and display the standard output logs
          echo "==================== EC2 DEPLOYMENT LOGS ===================="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text
          echo "============================================================"

          if [ "$STATUS" != "Success" ]; then
            echo "❌ Deployment failed on EC2 server with status: $STATUS"
            echo "==================== ERROR LOGS ===================="
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "StandardErrorContent" \
              --output text
            echo "===================================================="
            exit 1
          fi

          echo "🎉 End-to-End Zero-Touch Deployment Completed Successfully!"
